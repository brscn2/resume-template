# Site settings
title: "Jekyll Resume Template"
description: "A resume template for Jekyll and GitHub Pages sites."

# Build settings
markdown: kramdown
sass:
  sass_dir: _sass
  style: compressed

# Resume settings
resume_avatar:                  "false"
resume_name:                    "Baris Can"
resume_title:                   "AI Software Engineer (SAP STAR) | MSc Informatics Candidate @ TUM"

# used for the contact button in _layouts/resume.html
resume_contact_email:           "bariscan.swe@gmail.com"

# the next two items are used for schema itemprops in _layouts/resume.html
resume_contact_telephone:       "+49 155 10880061"
resume_contact_address:         "Munich, DE"

resume_header_contact_info:     "Munich, DE • +49 155 10880061 • bariscan.swe@gmail.com"
display_header_contact_info:    "true"

resume_header_intro: "<p>MSc Informatics candidate at TUM and Software Engineer in the SAP STAR program with hands-on expertise in distributed systems, scalable microservices, and AI-integrated architecture. Experienced in architecting robust backend solutions and agentic frameworks (LangChain, crewAI) for enterprise environments and global fintech platforms. Adept at bridging advanced computer science fundamentals with production-ready, high-impact systems.</p>"

# use "yes" to display the email contact button,
# "no" to display an "I'm not looking for work" message,
# or remove the resume_looking_for_work option entirely
# to leave blank

# Decide which sections to use
# comment out to hide
resume_section_experience:      true
resume_section_education:       true
resume_section_projects:        true
resume_section_skills:          true
resume_section_recognition:     false
resume_section_links:           true
resume_section_associations:    false
# resume_section_interests:       true

# Resume social links
# uncomment the options you wish to display, and add your own URL
resume_social_links:
  resume_github_url:            "https://github.com/brscn2"
  # resume_facebook_url:          "insert Facebook URL here"
  resume_linkedin_url:          "https://www.linkedin.com/in/baris-can/"
  # resume_instagram_url:         "insert your Instagram URL here"
  # resume_website_url:           "https://example.com"
  # resume_medium_url:            "https://medium.com/@username"
resume_print_social_links:      true

# Design settings
resume_theme:                   default

# Note: when editing locally, remember to restart
# your Jekyll server when you edit this file. Changes
# to _config.yml are only recognized when the server starts
